<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" rx="24" fill="#0B1F3A"/>
  <circle cx="500" cy="80" r="150" fill="#14B8A6" fill-opacity="0.12"/>
  <circle cx="90" cy="320" r="140" fill="#1E3A5F" fill-opacity="0.4"/>

  <!-- Main Pipeline Card -->
  <rect x="70" y="55" width="460" height="290" rx="20" fill="#071527" stroke="#1E3A5F" stroke-width="2"/>

