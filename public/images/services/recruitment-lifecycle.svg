  <circle cx="100" cy="80" r="6" fill="#EF4444" fill-opacity="0.8"/>
  <circle cx="118" cy="80" r="6" fill="#F59E0B" fill-opacity="0.8"/>
  <circle cx="136" cy="80" r="6" fill="#10B981" fill-opacity="0.8"/>
  <text x="300" y="85" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="0.5">PERMANENT HIRING LIFECYCLE</text>

  <!-- Step 1: Role Brief -->
  <g transform="translate(95, 120)">
    <rect width="160" height="85" rx="12" fill="#0B1F3A" stroke="#14B8A6" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#14B8A6" fill-opacity="0.2"/>
    <circle cx="28" cy="28" r="6" stroke="#2DD4BF" stroke-width="2"/>
    <line x1="33" y1="33" x2="38" y2="38" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
    <text x="50" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">1. Role Brief</text>
    <text x="18" y="56" font-family="system-ui, sans-serif" font-size="9.5" fill="#94A3B8">Requirement Mapping</text>
    <text x="18" y="70" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#2DD4BF">Skills, Budget &amp; Scope</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 265 162 L 285 162 M 281 157 L 286 162 L 281 167" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2: 72-Hr Shortlist -->
  <g transform="translate(295, 120)">
    <rect width="210" height="85" rx="12" fill="#0B1F3A" stroke="#1E3A5F" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#3B82F6" fill-opacity="0.2"/>
    <path d="M 22 28 L 26 32 L 34 24" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">2. 72-Hr Shortlist</text>
    <text x="18" y="56" font-family="system-ui, sans-serif" font-size="9.5" fill="#94A3B8">Fast-Track Delivery</text>
    <text x="18" y="70" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#60A5FA">Curated &amp; Pre-Screened</text>
  </g>

  <!-- Step 3: Vetted Interviews -->
  <g transform="translate(95, 225)">
    <rect width="160" height="85" rx="12" fill="#0B1F3A" stroke="#1E3A5F" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#F59E0B" fill-opacity="0.2"/>
    <circle cx="28" cy="25" r="5" stroke="#FBBF24" stroke-width="1.5"/>
    <path d="M 20 35 C 20 31 24 30 28 30 C 32 30 36 31 36 35" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="50" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">3. Vetted Interviews</text>
    <text x="18" y="56" font-family="system-ui, sans-serif" font-size="9.5" fill="#94A3B8">Skill Checks &amp; Ref Checks</text>
    <text x="18" y="70" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#FBBF24">Structured Coordination</text>
