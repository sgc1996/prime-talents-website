    <circle cx="28" cy="28" r="14" fill="#10B981" fill-opacity="0.2"/>
    <path d="M 22 28 L 26 32 L 34 24" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">4. 90-Day Guarantee</text>
