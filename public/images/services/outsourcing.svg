<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" rx="24" fill="#0B1F3A"/>
  <circle cx="500" cy="80" r="140" fill="#14B8A6" fill-opacity="0.1"/>
  <circle cx="80" cy="320" r="160" fill="#1E3A5F" fill-opacity="0.5"/>

  <!-- Global Hub Visualization -->
  <rect x="90" y="70" width="420" height="260" rx="18" fill="#071527" stroke="#1E3A5F" stroke-width="2"/>

  <!-- Network Map Connections -->
  <circle cx="170" cy="170" r="32" fill="#0B1F3A" stroke="#14B8A6" stroke-width="2"/>
  <text x="170" y="174" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2DD4BF" text-anchor="middle">Colombo</text>
  <text x="170" y="188" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Hub Center</text>

  <circle cx="340" cy="130" r="26" fill="#0B1F3A" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="340" y="134" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#93C5FD" text-anchor="middle">London</text>

  <circle cx="430" cy="220" r="26" fill="#0B1F3A" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="430" y="224" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FCD34D" text-anchor="middle">Singapore</text>

  <circle cx="280" cy="260" r="26" fill="#0B1F3A" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="280" y="264" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#C4B5FD" text-anchor="middle">Dubai</text>

  <!-- Connection Lines with Animated Dash Feel -->
  <line x1="202" y1="160" x2="314" y2="136" stroke="#14B8A6" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="198" y1="184" x2="258" y2="246" stroke="#14B8A6" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="364" y1="144" x2="410" y2="204" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="306" y1="254" x2="404" y2="230" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Badge at bottom -->
  <rect x="130" y="280" width="340" height="34" rx="8" fill="#0B1F3A" stroke="#14B8A6" stroke-width="1"/>
  <text x="300" y="302" font-family="system-ui, sans-serif" font-size="12" fill="#2DD4BF" font-weight="600" text-anchor="middle">Turnkey PEO & Employer of Record (EOR) in Sri Lanka</text>
</svg>

