<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F3A" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#14B8A6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#071527" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.2" />
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="200" r="180" fill="url(#tealGlow)" filter="url(#blurFilter)" />
  <circle cx="600" cy="400" r="220" fill="#0B1F3A" filter="url(#blurFilter)" />

  <!-- Modern Geometric Structure -->
  <rect x="180" y="80" width="440" height="340" rx="24" fill="#0B1F3A" fill-opacity="0.75" stroke="#14B8A6" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Network Nodes & Connecting Lines -->
  <path d="M 240 180 L 380 150 L 520 220 L 400 320 Z" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
  
  <!-- Vetted Talent Badges -->
  <g transform="translate(220, 160)">
    <circle cx="20" cy="20" r="24" fill="#14B8A6" fill-opacity="0.2" stroke="#2DD4BF" stroke-width="2"/>
    <path d="M 12 20 L 18 26 L 28 14" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(360, 130)">
    <circle cx="20" cy="20" r="26" fill="#0B1F3A" stroke="#14B8A6" stroke-width="2"/>
    <circle cx="20" cy="14" r="7" fill="#2DD4BF" />
    <path d="M 10 28 C 10 23 15 22 20 22 C 25 22 30 23 30 28" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <g transform="translate(500, 200)">
    <circle cx="20" cy="20" r="22" fill="#14B8A6" fill-opacity="0.25" stroke="#14B8A6" stroke-width="2"/>
    <path d="M 14 20 L 26 20 M 20 14 L 20 26" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g transform="translate(380, 300)">
    <circle cx="20" cy="20" r="24" fill="#071527" stroke="#2DD4BF" stroke-width="2"/>
    <path d="M 13 21 L 18 26 L 27 15" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Metric Card Overlay -->
  <g transform="translate(320, 360)">
    <rect width="280" height="96" rx="16" fill="#FFFFFF" fill-opacity="0.95" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="36" cy="48" r="18" fill="#CCFBF1" />
    <path d="M 29 48 L 34 53 L 43 43" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="42" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0B1F3A">98% Retention Rate</text>
    <text x="68" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#64748B">Verified Placements in Sri Lanka</text>
  </g>
</svg>

